cts/digital-class">Digital Class</a>: Digital textbooks and study material, in the chat.</li><li><a href="/products/mind-maze">Mind Maze</a>: A daily puzzle to build logical thinking.</li><li><a href="/products/free-stories">Free Stories and Rhymes</a>: Stories and rhymes in the child’s own language, to build a reading habit.</li><li><a href="/products/word-hunt">Word Hunt</a>: A word game to build English and Hindi vocabulary.</li><li><a href="/products/spelling-bee">Spelling Bee</a>: Spelling practice in a competition-style challenge.</li><li><a href="/products/mis">MIS: School, Teacher and Student Registry</a>: One registry for every school, teacher and student in the UT, kept in step with UDISE+.</li><li><a href="/products/idp">Integrated Dashboard Platform (IDP 1.0)</a>: Every VSK dashboard in one place, with access set by role and location.</li><li><a href="/products/crm-ivrs">CRM Support and IVRS Helpline</a>: One point of contact for teachers, Head Masters and parents, by phone and chat.</li></ul></div></noscript>
